    <section class="tool-hero wide-container">
      <p class="eyebrow">幸运抽签 / 决策实验室</p>
      <h1 class="tool-title">幸运抽签站</h1>
      <p class="tool-desc">列表、数字、是 / 否、权重与历史记录。</p>
    </section>
    <section id="draw-tool" class="wide-container draw-shell">
      <div class="glass-card draw-panel">
        <div class="draw-tabs" role="group" aria-label="Draw mode">
          <button class="draw-tab active" type="button" data-mode="list">列表抽签</button>
          <button class="draw-tab" type="button" data-mode="number">数字范围</button>
          <button class="draw-tab" type="button" data-mode="yesno">是 / 否</button>
          <button class="draw-tab" type="button" data-mode="weight">权重抽签</button>
        </div>
        <div class="draw-mode active" data-mode="list">
          <label class="section-kicker" for="draw-items">每行一个选项</label>
          <textarea id="draw-items">火锅
烤肉
麦当劳
兰州拉面
便利店饭团
麻辣烫</textarea>
          <div class="switch-row"><label><input id="dedupe-items" type="checkbox" checked /> 去重</label><button class="btn sample-btn" type="button" data-sample="写代码|打游戏|整理桌面|复盘项目|出门散步|看一集番">事项模板</button><button class="btn sample-btn" type="button" data-sample="火锅|烧烤|米线|麻辣烫|汉堡|便利店">吃饭模板</button></div>
        </div>
        <div class="draw-mode" data-mode="number">
          <label class="section-kicker">数字范围</label>
          <div class="option-row"><input aria-label="Minimum number" id="num-min" class="input" type="number" value="1" /><input aria-label="Maximum number" id="num-max" class="input" type="number" value="100" /></div>
          
        </div>
        <div class="draw-mode" data-mode="yesno">
          
          <div class="tags"><span class="tag">是</span><span class="tag">否</span><span class="tag">再想想</span></div>
        </div>
        <div class="draw-mode" data-mode="weight">
          <label class="section-kicker" for="weight-items">格式：选项 | 权重</label>
          <textarea id="weight-items">高优先级任务 | 5
普通任务 | 2
摸鱼五分钟 | 1</textarea>
          
        </div>
        <div class="action-row"><button id="draw-start" class="btn primary" type="button">开始抽签</button><button id="draw-reset" class="btn" type="button">重置动画</button><button id="draw-copy" class="btn" type="button">复制结果</button></div>
      </div>
      <div class="glass-card draw-stage">
        <div id="draw-output" class="draw-output" aria-live="polite">准备开始</div>
        <div class="mini-grid"><div class="stat-card"><strong id="draw-count">0</strong><span>历史次数</span></div><div class="stat-card"><strong id="draw-unique">0</strong><span>不同结果</span></div></div>
        <div class="history-box"><h3>最近结果</h3><div id="draw-history" class="tags"><span class="tag">暂无历史</span></div><button id="history-clear" class="btn" type="button">清空历史</button></div>
      </div>
    </section>
