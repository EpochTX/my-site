</head>
<body class="tool-page">
  <div id="wallpaper-layer" class="wallpaper-layer" aria-hidden="true"></div>
  <div class="wallpaper-overlay" aria-hidden="true"></div>
  <div class="noise-layer" aria-hidden="true"></div>
  <nav id="site-nav" class="site-nav" aria-label="主导航">
    <div class="nav-shell">
      <div class="nav-links" aria-label="桌面导航">
        <a href="index.html#projects">项目</a>
        <a href="index.html#stack">技术栈</a>
        <a href="index.html#contact">联系</a>

        <a class="external" href="https://t.me/despairbad" target="_blank" rel="noopener noreferrer">Telegram</a>
        <button type="button" data-action="change-wallpaper">换一张</button>
      </div>
      <div class="nav-actions"><button id="open-palette" class="icon-btn" type="button" title="Ctrl + K">⌘K</button><button id="menu-toggle" class="menu-btn" type="button" aria-label="打开菜单" aria-expanded="false">☰</button></div>
    </div>
    <div id="mobile-panel" class="mobile-panel">
      <a href="index.html">首页</a>
      <a href="index.html#projects">项目</a>
      <a href="index.html#stack">技术栈</a>
      <a href="index.html#contact">联系</a>

      <a href="ip.html">IP 查询</a>
      <a href="chouqian.html">幸运抽签</a>
      <button type="button" data-action="change-wallpaper">换一张壁纸</button>
    </div>
  </nav>
  <main>
    <section class="tool-hero wide-container">
      <p class="eyebrow">NET SIGHT / IP 信息</p>
      <h1 class="tool-title">本地与出口 IP</h1>
      <p class="tool-desc">本地 / 出口 / 查询</p>
    </section>
    <section class="wide-container ip-layout">
      <div class="ip-stack">
        <div class="glass-card ip-card">
          <h2>本地 / 直连 IP</h2>
          <p class="meta">my.ip.cn 接口</p>
          <div id="local-ip-result" class="ip-result"><div class="info-row"><span>状态</span><strong>正在检测</strong></div></div>
        </div>
        <div class="glass-card ip-card">
          <h2>出口 IP</h2>
          <p class="meta">公网出口</p>
          <div id="exit-ip-result" class="ip-result"><div class="info-row"><span>状态</span><strong>正在查询</strong></div></div>
        </div>
        <div class="glass-card ip-card">
          <h2>自定义查询</h2>
          <form id="ip-form" class="form-row">
            <input id="ip-input" class="input" type="text" inputmode="url" placeholder="输入 IP / 域名，留空刷新当前出口 IP" />
            <button class="btn primary" type="submit">查询</button>
            <button id="refresh-ip" class="btn" type="button">刷新全部</button>
            <button id="clear-ip" class="btn" type="button">清空</button>
          </form>
          <p id="ip-status" class="tool-desc">准备查询...</p>
          <div id="query-ip-result" class="ip-result"><div class="info-row"><span>状态</span><strong>等待查询</strong></div></div>
        </div>
      </div>
      <div class="map-grid">
        <div class="glass-card map-panel">
          <h3>本地 / 直连 IP 地图</h3>
          <iframe id="local-map" class="map-frame" title="本地直连 IP 地图" loading="lazy" referrerpolicy="no-referrer" src="https://www.openstreetmap.org/export/embed.html?bbox=116.30%2C39.84%2C116.50%2C39.96&layer=mapnik&marker=39.90%2C116.40"></iframe>
          <p id="local-map-note" class="map-note">正在等待本地 IP 接口返回。</p>
        </div>
        <div class="glass-card map-panel">
          <h3>出口 IP 地图</h3>
          <iframe id="exit-map" class="map-frame" title="出口 IP 地图" loading="lazy" referrerpolicy="no-referrer" src="https://www.openstreetmap.org/export/embed.html?bbox=116.30%2C39.84%2C116.50%2C39.96&layer=mapnik&marker=39.90%2C116.40"></iframe>
        </div>
        <div class="glass-card map-panel">
          <h3>查询结果地图</h3>
          <iframe id="query-map" class="map-frame" title="查询结果地图" loading="lazy" referrerpolicy="no-referrer" src="https://www.openstreetmap.org/export/embed.html?bbox=116.30%2C39.84%2C116.50%2C39.96&layer=mapnik&marker=39.90%2C116.40"></iframe>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="wide-container footer-inner"><p>© 2026 EpochTX.</p><p><a href="tools.html">实验室</a></p></div></footer>
  <div id="palette-backdrop" class="palette-backdrop" aria-hidden="true">
    <div class="command-palette glass-card" role="dialog" aria-label="Command Palette">
      <div class="palette-head"><span>Command Palette</span><kbd>Esc</kbd></div>
      <div class="command-list">
        <button class="command" data-command="github"><span>Open GitHub</span><span>external</span></button>
        <button class="command" data-command="telegram"><span>Open Telegram</span><span>external</span></button>
        <button class="command" data-command="projects"><span>View Projects</span><span>home</span></button>
        <button class="command" data-command="wallpaper"><span>Change Wallpaper</span><span>imgRun</span></button>
        <button class="command" data-command="stack"><span>Scroll to Stack</span><span>home</span></button>
        <button class="command" data-command="labs"><span>Open Labs</span><span>route</span></button>
        <button class="command" data-command="ip"><span>Open IP Lookup</span><span>route</span></button>
        <button class="command" data-command="draw"><span>Open Lucky Draw</span><span>route</span></button>
      </div>
    </div>
  </div>
  <script src="assets/site.js?v=20260703-sharp" defer></script>
</body>
</html>
