<section class="tool-hero wide-container">
<p class="eyebrow">NET SIGHT / IP 信息</p>
<h1 class="tool-title">本地与出口 IP</h1>
<p class="tool-desc">本地 / 出口 / 查询</p>
</section>
<div class="glass-card query-workbench">
<h2>自定义查询</h2>
<form class="form-row" id="ip-form">
<input aria-label="IP address or domain" class="input" id="ip-input" inputmode="url" placeholder="输入 IP / 域名，留空刷新当前出口 IP" type="text"/>
<button class="btn primary" type="submit">查询</button>
<button class="btn" id="refresh-ip" type="button">刷新全部</button>
<button class="btn" id="clear-ip" type="button">清空</button>
</form>
<p class="tool-desc" id="ip-status">准备查询...</p>

<details class="query-details"><summary>查询结果</summary><div class="query-columns"><div class="ip-result" id="query-ip-result"><div class="info-row"><span>状态</span><strong>等待查询</strong></div></div><iframe class="map-frame" id="query-map" loading="lazy" referrerpolicy="no-referrer" src="about:blank" title="查询结果地图"></iframe></div></details></div><section class="wide-container ip-layout"><div class="glass-card ip-card">
<h2>本地 / 直连 IP</h2>
<p class="meta">my.ip.cn 接口</p>
<div class="ip-result" id="local-ip-result"><div class="info-row"><span>状态</span><strong>正在检测</strong></div></div>
<iframe class="map-frame" id="local-map" loading="lazy" referrerpolicy="no-referrer" src="about:blank" title="本地直连 IP 地图"></iframe><p class="map-note" id="local-map-note">正在等待本地 IP 接口返回。</p></div><div class="glass-card ip-card">
<h2>出口 IP</h2>
<p class="meta">公网出口</p>
<div class="ip-result" id="exit-ip-result"><div class="info-row"><span>状态</span><strong>正在查询</strong></div></div>
<iframe class="map-frame" id="exit-map" loading="lazy" referrerpolicy="no-referrer" src="about:blank" title="出口 IP 地图"></iframe></div></section>
